name: Promote verified displayed caption and blue bird source
on:
  push:
    branches: [codex/displayed-caption-icon]
    paths: [.github/workflows/promote-displayed-caption.yaml]
permissions:
  contents: write
  actions: read
concurrency:
  group: piko-newx-zh-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate provenance and download built bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e1618c110d2d8a22a0974866f70f6356271b9ec6 HEAD
          git diff --exit-code e1618c110d2d8a22a0974866f70f6356271b9ec6 HEAD -- build_piko.py piko-overrides piko-patches translations compatibility build_compatible.py tests
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38113810881 --jq .conclusion)" = success
          gh release view displayed-caption-check --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -F 'e1618c110d2d8a22a0974866f70f6356271b9ec6'
          mkdir bins
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/displayed-caption-check" > /tmp/candidate-release.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          release = json.loads(Path('/tmp/candidate-release.json').read_text())
          for asset in release['assets']:
              name = asset['name']
              if not name.endswith(('.mpp', '.json')): continue
              assert Path(name).name == name
              with (Path('bins') / name).open('wb') as output:
                  subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}",
                                  '-H', 'Accept: application/octet-stream'], stdout=output, check=True)
          PY
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          checksums = {'compatibility-bundles.json': 'e6f2693a95a44326b160a8b96eef3391177d676c0baf88acb05b616f09f7a710', 'patches-bundle.json': '53ca1804cb4ce0415e233f5e448bb82ef9ed85768582f1cfe7f09ad0e1ae25f9', 'patches-current.mpp': '43ed2f06f866ac8556fc25a7e241046291bd81ff0810b061f8b7b1bd239d4178', 'patches-legacy.mpp': 'fddf858866db76394e8a4b9318afa10e5eb0883bc4a44df4e23d6f7458772a8e', 'patches.mpp': 'e9c58ba84d7cca9d856c2b7f71f6a56a60a1a673b08d688edf1ceb5c2854c7f2', 'supported-versions.json': '31e606bdfa4de75ef878664b0fe9817703fc11a0b071928a23546bafb24bb589'}
          for name, expected in checksums.items():
              actual = hashlib.sha256((Path('bins') / name).read_bytes()).hexdigest()
              assert actual == expected, f'{name}: expected {expected}, got {actual}'
          prefix = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v3.54.2/"
          history = json.loads(Path('bins/compatibility-bundles.json').read_text())
          for entry in history:
              # Historical releases may reuse the same basename; compare only this release's assets.
              if not entry['download_url'].startswith(prefix): continue
              name = entry['download_url'].rsplit('/', 1)[1]
              path = Path('bins') / name
              if path.exists(): assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], name
          for name in ('patches-current.mpp', 'patches-legacy.mpp'):
              checksum = checksums[name]
              immutable = f'{Path(name).stem}-{checksum}.mpp'
              assert any(entry['download_url'] == prefix + immutable and entry['sha256'] == checksum for entry in history)
              assert hashlib.sha256((Path('bins') / immutable).read_bytes()).hexdigest() == checksum
          metadata = json.loads(Path('bins/patches-bundle.json').read_text())
          assert metadata['version'] == metadata['upstream_version'] == 'v3.54.2'
          assert metadata['piko_commit'] == '9abde9777d92af50fe1a53634262498fb630d7d3'
          assert len(metadata['supported_versions']) == 15
          Path('patches-bundle.json').write_bytes(Path('bins/patches-bundle.json').read_bytes())
          Path('compatibility-bundles.json').write_bytes(Path('bins/compatibility-bundles.json').read_bytes())
          PY
      - name: Update official-version release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v3.54.2 bins/*.mpp bins/supported-versions.json compatibility-bundles.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v3.54.2 --repo "$GITHUB_REPOSITORY" --latest --title 'Piko 3.54.2' \
            --notes '修复图标补丁的启动入口识别：支持 Activity 与别名、Android XML 属性命名空间，以及重复资源配置。版本与上游 3.54.2 一致。{text} 使用点击下载时贴文当前显示的原文或译文，不发起翻译请求；命名完成后清理文字。新增外观中的经典蓝鸟图标及启动页切换、预览与确认。默认命名仍跟随上游。命名文字最多暂存 240 字节 UTF-8 前缀，重复刷新复用弱引用记录。两套构建和显示状态、命名、寄存器回归检查通过，统一包覆盖 15 个版本。12.28 原包内部修补与 APK 清单检查通过；尚未进行手机运行实测。构建源：e1618c110d2d8a22a0974866f70f6356271b9ec6。'
      - name: Commit verified metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json compatibility-bundles.json
          git commit -m 'Update verified displayed caption and blue bird bundle metadata [skip ci]'
          git push origin HEAD:codex/displayed-caption-icon
      - name: Remove temporary validation release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete displayed-caption-check --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
