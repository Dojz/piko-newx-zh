name: Promote verified Classic vector icons
on:
  push:
    branches: [codex/adaptive-blue-bird]
    paths: [.github/workflows/promote-adaptive-icons.yaml]
permissions:
  contents: write
  actions: read
concurrency:
  group: piko-newx-zh-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate provenance and download built bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fd8351b286215d76eb74654903a1390be92bfd0c HEAD
          git diff --exit-code fd8351b286215d76eb74654903a1390be92bfd0c HEAD -- build_piko.py piko-overrides piko-patches translations compatibility build_compatible.py tests docs/assets
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38138171941 --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/38138171941 --jq .head_sha)" = fd8351b286215d76eb74654903a1390be92bfd0c
          gh release view blue-bird-adaptive-check --repo "$GITHUB_REPOSITORY" --json body --jq .body | grep -F 'fd8351b286215d76eb74654903a1390be92bfd0c'
          mkdir bins
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/blue-bird-adaptive-check" > /tmp/candidate-release.json
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          release = json.loads(Path('/tmp/candidate-release.json').read_text())
          expected_names = {'compatibility-bundles.json', 'patches-current-a2066288b6d2f095d9a7ab81c735fd254cdb7dea8bf646d242ff81d28be0124a.mpp', 'patches-current.mpp', 'patches-bundle.json', 'patches-legacy.mpp', 'supported-versions.json', 'patches.mpp', 'patches-legacy-c7be9db603fcefa4d3de3bbdc988b496504a08d2bc2e453d729b59cbe90c148c.mpp'}
          assert expected_names <= {asset['name'] for asset in release['assets']}
          for asset in release['assets']:
              name = asset['name']
              if name not in expected_names: continue
              assert Path(name).name == name
              with (Path('bins') / name).open('wb') as output:
                  subprocess.run(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/releases/assets/{asset['id']}",
                                  '-H', 'Accept: application/octet-stream'], stdout=output, check=True)
          PY
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          checksums = {'compatibility-bundles.json': 'd5867bb6e07fc2e04d380fcdd869247d9c481cfe6a66f59ce7956ece3c206358', 'patches-bundle.json': 'c9022a0d482e9fbf48d534a2d588b7f7e67621424e6410879df3fa1433b5b4f8', 'patches-current.mpp': 'a2066288b6d2f095d9a7ab81c735fd254cdb7dea8bf646d242ff81d28be0124a', 'patches-legacy.mpp': 'c7be9db603fcefa4d3de3bbdc988b496504a08d2bc2e453d729b59cbe90c148c', 'patches.mpp': 'df3dbec3d329fb3b02b0d5c750e31548d46c4909ce1c528deb4e8cc378d2bd54', 'supported-versions.json': '31e606bdfa4de75ef878664b0fe9817703fc11a0b071928a23546bafb24bb589', 'patches-current-a2066288b6d2f095d9a7ab81c735fd254cdb7dea8bf646d242ff81d28be0124a.mpp': 'a2066288b6d2f095d9a7ab81c735fd254cdb7dea8bf646d242ff81d28be0124a', 'patches-legacy-c7be9db603fcefa4d3de3bbdc988b496504a08d2bc2e453d729b59cbe90c148c.mpp': 'c7be9db603fcefa4d3de3bbdc988b496504a08d2bc2e453d729b59cbe90c148c'}
          assert {path.name for path in Path('bins').iterdir()} == set(checksums)
          for name, expected in checksums.items():
              actual = hashlib.sha256((Path('bins') / name).read_bytes()).hexdigest()
              assert actual == expected, f'{name}: expected {expected}, got {actual}'
          prefix = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/v3.54.2/"
          history = json.loads(Path('bins/compatibility-bundles.json').read_text())
          for entry in history:
              # Historical releases may reuse the same basename; compare only this release's assets.
              if not entry['download_url'].startswith(prefix): continue
              name = entry['download_url'].rsplit('/', 1)[1]
              path = Path('bins') / name
              if path.exists(): assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256'], name
          for name in ('patches-current.mpp', 'patches-legacy.mpp'):
              checksum = checksums[name]
              immutable = f'{Path(name).stem}-{checksum}.mpp'
              assert any(entry['download_url'] == prefix + immutable and entry['sha256'] == checksum for entry in history)
              assert hashlib.sha256((Path('bins') / immutable).read_bytes()).hexdigest() == checksum
          metadata = json.loads(Path('bins/patches-bundle.json').read_text())
          assert metadata['version'] == metadata['upstream_version'] == 'v3.54.2'
          assert metadata['piko_commit'] == '9abde9777d92af50fe1a53634262498fb630d7d3'
          assert len(metadata['supported_versions']) == 15
          Path('patches-bundle.json').write_bytes(Path('bins/patches-bundle.json').read_bytes())
          Path('compatibility-bundles.json').write_bytes(Path('bins/compatibility-bundles.json').read_bytes())
          PY
      - name: Update official-version release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v3.54.2 bins/*.mpp bins/supported-versions.json compatibility-bundles.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v3.54.2 --repo "$GITHUB_REPOSITORY" --latest --title 'Piko 3.54.2' \
            --notes '图标选择页与确认页统一采用更饱满的圆角方形预览：圆角为边长的 25%，72dp 预览使用 18dp 圆角，96dp 确认预览使用 24dp 圆角。原图标选项改名为默认，对应确认页标题和说明同步更新；经典和经典图标名称保留。维持官方 SVG、统一源、上游版本 3.54.2 与 15 个兼容版本。两套实现构建、选择映射与 ARSCLib 资源编码检查通过。本次预览显示仍需手机确认。构建源：fd8351b286215d76eb74654903a1390be92bfd0c。'
      - name: Commit verified metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add patches-bundle.json compatibility-bundles.json
          git commit -m 'Update verified Classic icon bundle metadata [skip ci]'
          git push origin HEAD:codex/adaptive-blue-bird
      - name: Remove temporary validation release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete blue-bird-adaptive-check --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
