name: Prepare Classic icon validation release
on:
  push:
    branches: [codex/adaptive-blue-bird]
    paths: [.github/workflows/prepare-adaptive-candidate.yaml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare an unpublished-to-managers validation endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view blue-bird-adaptive-check --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create blue-bird-adaptive-check --repo "$GITHUB_REPOSITORY" --target main \
              --prerelease --latest=false --title 'Classic vector icon validation'
