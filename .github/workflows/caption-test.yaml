name: Caption template test bundle

on:
  push:
    branches: [caption-test]
    paths-ignore:
      - patches-bundle.json
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: caption-template-test
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIKO_COMMIT: f116ed9349db4f486bfb216071d18207901d5107
        run: |
          python - <<'PY'
          import os
          from build_piko import build_piko_patches
          version = "3.54.0-caption." + os.environ["GITHUB_RUN_NUMBER"]
          build = build_piko_patches("bins/patches.mpp", patch_version=version)
          assert build.commit == os.environ["PIKO_COMMIT"]
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("TEST_VERSION=" + version + "\n")
          PY
      - name: Publish test bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$TEST_VERSION" bins/patches.mpp \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Caption template test $TEST_VERSION" --prerelease \
            --notes 'Test build for X 12.30.0-prod.01. Adds {text} and {translatedText}.'
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          version = "v" + os.environ["TEST_VERSION"]
          metadata = {
              "version": version,
              "download_url": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/releases/download/" + version + "/patches.mpp",
              "created_at": datetime.now(timezone.utc).isoformat(),
              "description": "Piko caption template test",
              "app_version": "12.30.0-prod.01",
              "piko_commit": "f116ed9349db4f486bfb216071d18207901d5107"
          }
          with open("patches-bundle.json", "w") as output:
              json.dump(metadata, output, indent=2)
              output.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches-bundle.json
          git commit -m "Publish caption test metadata [skip ci]"
          git push origin HEAD:caption-test
