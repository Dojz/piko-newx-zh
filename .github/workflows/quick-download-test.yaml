name: Long-press download validation
on:
  push:
    branches: [codex/long-press-download-options]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: python tests/check_quick_download.py
      - run: python tests/check_download_caption.py
      - name: Build current and all retained version targets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIKO_VALIDATE: "1"
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from build_piko import build_piko_patches
          from build_compatible import assemble_compatible_bundle, fetch
          entries = json.loads(Path("compatibility-bundles.json").read_text())
          Path("bins").mkdir(exist_ok=True)
          os.environ["PIKO_COMMIT"] = entries[-1]["piko_commit"]
          build_piko_patches("bins/patches-current.mpp", patch_version="3.58.0-quick-download")
          fetch("https://github.com/MorpheApp/morphe-desktop/releases/download/v1.18.1/morphe-desktop-1.18.1-all.jar",
                Path("bins/morphe-cli.jar"), "1b506ab5f03d16a2f65026d5e0e1910d01fc1e2152f21eaeb44ed2f30856597b")
          versions = assemble_compatible_bundle(Path("bins/patches-current.mpp"), Path("bins/patches.mpp"),
                                               "3.58.0-quick-download", Path("bins/morphe-cli.jar"))
          required = {"12.27.0-prod.01", "12.28.0-alpha.01", "12.28.0-alpha.04", "12.28.0-prod.01",
                      "12.29.0-alpha.04", "12.29.1-prod.01", "12.30.0-alpha.05", "12.30.0-prod.01",
                      "12.31.0-alpha.02", "12.31.0-alpha.04", "12.32.0-alpha.04", "12.32.0-prod.01",
                      "12.33.0-alpha.01", "12.33.0-alpha.02", "12.33.0-prod.01", "12.33.1-prod.01",
                      "12.34.0-prod.01", "12.35.0-prod.01"}
          assert required <= versions
          Path("bins/targets.json").write_text(json.dumps(sorted(versions), indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Piko-long-press-download-options
          path: |
            bins/patches.mpp
            bins/targets.json
